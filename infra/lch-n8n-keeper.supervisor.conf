[program:lch-n8n-keeper]
command=/bin/bash /workspace/.deployment-tools/lch-n8n-keepalive.sh
directory=/workspace/.deployment-tools
autostart=true
autorestart=true
startsecs=2
startretries=10
stopwaitsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/.deployment-tools/lch-site-runtime/logs/n8n-keeper.stdout.log
stderr_logfile=/workspace/.deployment-tools/lch-site-runtime/logs/n8n-keeper.stderr.log
stdout_logfile_maxbytes=5242880
stdout_logfile_backups=2
stderr_logfile_maxbytes=5242880
stderr_logfile_backups=2
