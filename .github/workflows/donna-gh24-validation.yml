name: Donna GH-24 validation
on:
  pull_request:
    paths:
      - 'index.html'
      - 'public/assets/social/**'
      - 'scripts/social-preview.html'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/donna-gh24-validation.yml'
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test
      - run: npm run typecheck
      - name: Build guarded Firebase contact bundle with synthetic public config
        env:
          VITE_CONTACT_PROJECT_ID: ci-demo-project
          VITE_CONTACT_APP_ID: ci-app-id
          VITE_CONTACT_API_KEY: ci-public-placeholder
          VITE_CONTACT_AUTH_DOMAIN: ci-demo.firebaseapp.com
          VITE_CONTACT_STORAGE_BUCKET: ci-demo.appspot.com
          VITE_CONTACT_MESSAGING_SENDER_ID: '123456789'
          VITE_CONTACT_DATABASE_ID: ci-test-database
        run: npm run build:deploy
      - name: Install Playwright for cross-viewport browser verification
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start compiled LCH server
        env:
          PORT: '4254'
          HOST: 127.0.0.1
          DIST_DIR: ${{ github.workspace }}/dist
          RELEASE_SHA: gh24-ci-browser
        run: |
          nohup node dist/server.mjs > /tmp/lch-gh24-server.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:4254/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/lch-gh24-server.log
          exit 1
      - name: Test live form completion in mobile and desktop Chromium
        env:
          LCH_SMOKE_URL: http://127.0.0.1:4254/
        run: node scripts/donna-live-form-smoke.cjs
