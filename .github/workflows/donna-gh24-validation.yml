name: Donna GH-24 validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/donna-gh24-validation.yml'
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test
      - run: npm run typecheck
      - name: Build guarded Firebase contact bundle with synthetic public config
        env:
          VITE_CONTACT_PROJECT_ID: ci-demo-project
          VITE_CONTACT_APP_ID: ci-app-id
          VITE_CONTACT_API_KEY: ci-public-placeholder
          VITE_CONTACT_AUTH_DOMAIN: ci-demo.firebaseapp.com
          VITE_CONTACT_STORAGE_BUCKET: ci-demo.appspot.com
          VITE_CONTACT_MESSAGING_SENDER_ID: '123456789'
          VITE_CONTACT_DATABASE_ID: ci-test-database
        run: npm run build:deploy
